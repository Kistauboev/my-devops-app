services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: devplatform-backend
    ports:
      - "8000:8000"
    environment:
      - DEMO_MODE=${DEMO_MODE:-true}
      - GITHUB_APP_ID=${GITHUB_APP_ID:-}
      - GITHUB_INSTALLATION_ID=${GITHUB_INSTALLATION_ID:-}
      - GITHUB_PRIVATE_KEY=${GITHUB_PRIVATE_KEY:-}
      - APPROVAL_TOKEN=${APPROVAL_TOKEN:-}
      - KUBE_CONFIG=${KUBE_CONFIG:-}
      - VAULT_ADDR=${VAULT_ADDR:-}
      - VAULT_TOKEN=${VAULT_TOKEN:-}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - DEFAULT_REGISTRY_USERNAME=${DEFAULT_REGISTRY_USERNAME:-}
      - DEFAULT_REGISTRY_PASSWORD=${DEFAULT_REGISTRY_PASSWORD:-}
      - DEFAULT_KUBE_CONFIG=${DEFAULT_KUBE_CONFIG:-}
    volumes:
      - ./backend:/app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: devplatform-frontend
    ports:
      - "80:80"
    environment:
      - VITE_API_BASE=${VITE_API_BASE:-http://localhost:8000}
    depends_on:
      - backend
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: devplatform-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./infra/monitoring/prometheus-docker.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - default

  grafana:
    image: grafana/grafana:latest
    container_name: devplatform-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_INSTALL_PLUGINS=
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infra/monitoring/grafana-datasources-docker.yml:/etc/grafana/provisioning/datasources/prometheus.yml
      - ./infra/monitoring/grafana-dashboard-provisioning.yml:/etc/grafana/provisioning/dashboards/default.yml
      - ./infra/monitoring/grafana-dashboards-docker.json:/var/lib/grafana/dashboards/devplatform-dashboard.json
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - default

volumes:
  prometheus-data:
  grafana-data:

networks:
  default:
    name: devplatform-network




