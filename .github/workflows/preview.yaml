name: devplatform-preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

env:
  REGISTRY: ghcr.io
  PREVIEW_NS: pr-${{ github.event.pull_request.number }}
  RELEASE_NAME: pr-${{ github.event.pull_request.number }}
  HOST_SUFFIX: devplatform.local

jobs:
  deploy-preview:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set lowercase image name
        id: image-name
        run: |
          IMAGE_NAME=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_NAME=${IMAGE_NAME}" >> $GITHUB_ENV
          echo "name=${IMAGE_NAME}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend:pr-${{ github.event.pull_request.number }}-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend:pr-${{ github.event.pull_request.number }}-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check KUBE_CONFIG secret
        id: check-kube-config
        run: |
          if [ -n "${KUBE_CONFIG:-}" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}

      - name: Set kube context
        if: steps.check-kube-config.outputs.exists == 'true'
        uses: azure/k8s-set-context@v4
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBE_CONFIG }}

      - name: Deploy preview via Helm
        if: steps.check-kube-config.outputs.exists == 'true'
        run: |
          helm upgrade --install ${{ env.RELEASE_NAME }} infra/helm/devplatform \
            --namespace ${{ env.PREVIEW_NS }} --create-namespace \
            --set namespace=${{ env.PREVIEW_NS }} \
            --set image.repository=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend \
            --set image.tag=pr-${{ github.event.pull_request.number }}-${{ github.sha }} \
            --set ingress.host=pr-${{ github.event.pull_request.number }}.${{ env.HOST_SUFFIX }}

  teardown-preview:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Check KUBE_CONFIG secret
        id: check-kube-config
        run: |
          if [ -n "${KUBE_CONFIG:-}" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}

      - name: Set kube context
        if: steps.check-kube-config.outputs.exists == 'true'
        uses: azure/k8s-set-context@v4
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBE_CONFIG }}

      - name: Delete preview namespace
        if: steps.check-kube-config.outputs.exists == 'true'
        run: |
          kubectl delete namespace ${{ env.PREVIEW_NS }} --ignore-not-found=true
