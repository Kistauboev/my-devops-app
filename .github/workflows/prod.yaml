name: devplatform-prod

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  RELEASE_NAME: prod
  NAMESPACE: prod
  HOST: app.devplatform.local

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set lowercase image name
        run: echo "IMAGE_NAME=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend:prod
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend:prod
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-prod:
    needs: build-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set lowercase image name
        run: echo "IMAGE_NAME=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Check KUBE_CONFIG_PROD secret
        id: check-kube-config
        run: |
          if [ -n "${KUBE_CONFIG_PROD:-}" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
        env:
          KUBE_CONFIG_PROD: ${{ secrets.KUBE_CONFIG_PROD }}

      - name: Install Helm
        if: steps.check-kube-config.outputs.exists == 'true'
        uses: azure/setup-helm@v4

      - name: Set kube context
        if: steps.check-kube-config.outputs.exists == 'true'
        uses: azure/k8s-set-context@v4
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBE_CONFIG_PROD }}

      - name: Deploy via Helm (rolling update)
        if: steps.check-kube-config.outputs.exists == 'true'
        run: |
          helm upgrade --install ${{ env.RELEASE_NAME }} infra/helm/devplatform \
            --namespace ${{ env.NAMESPACE }} --create-namespace \
            --set namespace=${{ env.NAMESPACE }} \
            --set image.repository=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend \
            --set image.tag=${{ github.sha }} \
            --set ingress.host=${{ env.HOST }} \
            --set replicaCount=3
