name: devplatform-prod

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  RELEASE_NAME: prod
  NAMESPACE: prod
  HOST: app.devplatform.local

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set lowercase image name
        run: echo "IMAGE_NAME=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend:prod
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend:prod
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-prod:
    needs: build-push
    runs-on: ubuntu-latest
    # Skip deployment if secrets are not configured
    if: secrets.KUBE_CONFIG_PROD != ''
    steps:
      - uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Set kube context
        uses: azure/k8s-set-context@v4
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBE_CONFIG_PROD }}

      - name: Deploy via Helm (rolling update)
        run: |
          helm upgrade --install $RELEASE_NAME infra/helm/devplatform \
            --namespace $NAMESPACE --create-namespace \
            --set namespace=$NAMESPACE \
            --set image.repository=${REGISTRY}/${IMAGE_NAME}-backend \
            --set image.tag=${{ github.sha }} \
            --set ingress.host=$HOST \
            --set replicaCount=3

