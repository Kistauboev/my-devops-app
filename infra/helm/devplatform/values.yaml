image:
  repository: ghcr.io/your-org/your-app
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 80

ingress:
  enabled: true
  className: nginx
  host: "devplatform.local"
  tls: false

resources:
  limits:
    cpu: "500m"
    memory: "512Mi"
  requests:
    cpu: "200m"
    memory: "256Mi"

replicaCount: 2

env: []

podAnnotations: {}

namespace: ""

